[project]
name = "mysite"
version = "0.1.0"
description = "Учебный Django-проект Skillbox: магазин, блог, профили пользователей, REST API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "django (>=5.2,<5.3)",
    "djangorestframework (>=3.16,<4.0)",
    "django-filter (>=25.1,<27.0)",
    "django-debug-toolbar (>=6.0,<9.0)",
    "pillow (>=11.0,<14.0)",
    "gunicorn (>=23.0,<24.0)",
]

[tool.poetry]
# Это приложение, а не библиотека: устанавливать сам проект как пакет не нужно
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
