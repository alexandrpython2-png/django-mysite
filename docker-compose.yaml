services:
  app:
    build:
      dockerfile: ./Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput
      && gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "80:8000"
    restart: always
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "200k"
    volumes:
      - ./mysite/database:/app/database
      - ./mysite/uploads:/app/uploads
